    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>AI Chat Window</title>
    <script>
      // 渲染前根据保存的外观模式或系统偏好应用深色模式，避免首屏闪烁。
      // 与 src/app/App.tsx 中 THEME_MODE_KEY 保持一致。
      (function () {
        try {
          var mode = localStorage.getItem("aether-ai-theme-mode");
          var dark = mode === "dark" || (mode !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
