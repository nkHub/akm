{% extends "_layout.html" %}
{% block content %}
<!-- 时间范围切换 -->
<div class="flex items-center gap-2 mb-4">
  <span class="text-xs text-gray-500 mr-1">时间范围</span>
  <akm-range-tabs id="dashboard-days"></akm-range-tabs>
  <span id="stat-cached-at" class="text-xs text-gray-600 ml-auto">—</span>
</div>
<!-- 统计概览 -->
<!-- 骨架屏 -->
<div id="dashboard-skeleton">
  <div id="skeleton-stats" class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
    <div id="sk-cost" class="hidden bg-surface-light border border-border rounded-lg p-4"><div class="skeleton h-3 w-12 mb-3"></div><div class="skeleton h-7 w-20"></div></div>
    <div class="bg-surface-light border border-border rounded-lg p-4"><div class="skeleton h-3 w-12 mb-3"></div><div class="skeleton h-7 w-20"></div></div>
    <div class="bg-surface-light border border-border rounded-lg p-4"><div class="skeleton h-3 w-14 mb-3"></div><div class="skeleton h-7 w-24"></div></div>
    <div class="bg-surface-light border border-border rounded-lg p-4"><div class="skeleton h-3 w-14 mb-3"></div><div class="skeleton h-7 w-24"></div></div>
    <div class="bg-surface-light border border-border rounded-lg p-4"><div class="skeleton h-3 w-14 mb-3"></div><div class="skeleton h-7 w-24"></div></div>
    <div class="bg-surface-light border border-border rounded-lg p-4"><div class="skeleton h-3 w-20 mb-3"></div><div class="skeleton h-7 w-24"></div></div>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-surface-light border border-border rounded-lg overflow-hidden">
      <div class="px-4 py-3 border-b border-border"><div class="skeleton h-3 w-12"></div></div>
      <div class="p-4" style="height:260px">

          <div class="flex-1 space-y-3">
            <div class="skeleton h-3 w-full"></div><div class="skeleton h-3 w-5/6"></div><div class="skeleton h-3 w-4/6"></div><div class="skeleton h-3 w-3/6"></div>

        </div>

    </div>
    <div class="bg-surface-light border border-border rounded-lg overflow-hidden">
      <div class="px-4 py-3 border-b border-border"><div class="skeleton h-3 w-12"></div></div>
      <div class="p-4" style="height:260px">
        <div class="skeleton h-2.5 w-24"></div>
        <div class="flex items-center gap-4 mt-4">
          <div class="skeleton rounded-full shrink-0" style="width:168px;height:168px"></div>
          <div class="flex-1 space-y-3">
            <div class="skeleton h-3 w-full"></div><div class="skeleton h-3 w-5/6"></div><div class="skeleton h-3 w-4/6"></div><div class="skeleton h-3 w-3/6"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
    <div class="bg-surface-light border border-border rounded-lg overflow-hidden">
      <div class="px-4 py-3 border-b border-border"><div class="skeleton h-3 w-12"></div></div>
      <div class="p-4" style="height:260px">
        <div class="skeleton h-2.5 w-24"></div>
        <div class="flex items-center gap-4 mt-4">
          <div class="skeleton rounded-full shrink-0" style="width:168px;height:168px"></div>
          <div class="flex-1 space-y-3">
            <div class="skeleton h-3 w-full"></div><div class="skeleton h-3 w-5/6"></div><div class="skeleton h-3 w-4/6"></div><div class="skeleton h-3 w-3/6"></div>
          </div>
        </div>

    <div class="bg-surface-light border border-border rounded-lg overflow-hidden">

      <div class="p-4" style="height:260px"><div class="skeleton h-full w-full"></div></div>
    </div>

</div>

<!-- 真实内容（初始隐藏） -->
<div id="dashboard-content" class="hidden">
<div id="stats-cards" class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6">
  <div id="stat-cost-card" class="hidden bg-surface-light border border-border rounded-lg p-4">
    <div class="text-xs text-gray-500 mb-1">总费用</div>
    <div id="stat-cost" class="text-2xl font-semibold text-rose-400 token-number">-</div>
  </div>
  <div class="bg-surface-light border border-border rounded-lg p-4">
    <div class="text-xs text-gray-500 mb-1">总请求</div>
    <div id="stat-requests" class="text-2xl font-semibold text-white token-number">-</div>
  </div>
  <div class="bg-surface-light border border-border rounded-lg p-4">
    <div class="text-xs text-gray-500 mb-1">总 Token</div>
    <div id="stat-total" class="text-2xl font-semibold text-indigo-400 token-number">-</div>
  </div>
  <div class="bg-surface-light border border-border rounded-lg p-4">
    <div class="text-xs text-gray-500 mb-1">输入 Token</div>
    <div id="stat-prompt" class="text-2xl font-semibold text-emerald-400 token-number">-</div>
  </div>
  <div class="bg-surface-light border border-border rounded-lg p-4">
    <div class="text-xs text-gray-500 mb-1">输出 Token</div>
    <div id="stat-completion" class="text-2xl font-semibold text-amber-400 token-number">-</div>
  </div>
  <div class="bg-surface-light border border-border rounded-lg p-4">
    <div class="text-xs text-gray-500 mb-1">缓存命中 Token</div>
    <div id="stat-cached" class="text-2xl font-semibold text-teal-400 token-number">-</div>
  </div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="bg-surface-light border border-border rounded-lg overflow-hidden flex flex-col">
    <div class="px-4 py-3 border-b border-border flex items-center justify-between gap-3 flex-wrap">
      <span class="text-xs font-medium text-gray-400">按 Key</span>
      <div class="flex items-center gap-2">
        <div id="metricwrap-key" class="invisible"><akm-range-tabs id="metric-key"></akm-range-tabs></div>
        <akm-range-tabs id="view-key"></akm-range-tabs>
      </div>
    </div>
    <div id="table-key" class="hidden flex-col" style="height:260px">
      <div class="flex-1 min-h-0">
        <table class="w-full text-sm table-fixed"><colgroup id="cg-provider"><col style="width:30%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:14%"></colgroup><tbody id="tbl-provider"></tbody></table>
      </div>
      <div id="pagerwrap-key" class="hidden shrink-0 border-t border-border px-3 py-1 items-center justify-end">
        <akm-pagination id="pager-key"></akm-pagination>
      </div>
    </div>
    <div id="chart-key" class="p-4 flex items-center" style="height:260px">
      <akm-donut-chart id="donut-key" class="w-full"></akm-donut-chart>
    </div>
  </div>
  <div class="bg-surface-light border border-border rounded-lg overflow-hidden flex flex-col">
    <div class="px-4 py-3 border-b border-border flex items-center justify-between gap-3 flex-wrap">
      <span class="text-xs font-medium text-gray-400">按模型</span>
      <div class="flex items-center gap-2">
        <div id="metricwrap-model" class="invisible"><akm-range-tabs id="metric-model"></akm-range-tabs></div>
        <akm-range-tabs id="view-model"></akm-range-tabs>
      </div>
    </div>
    <div id="table-model" class="hidden flex-col" style="height:260px">
      <div class="flex-1 min-h-0">
        <table class="w-full text-sm table-fixed"><colgroup id="cg-model"><col style="width:30%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:14%"></colgroup><tbody id="tbl-model"></tbody></table>
      </div>
      <div id="pagerwrap-model" class="hidden shrink-0 border-t border-border px-3 py-1 items-center justify-end">
        <akm-pagination id="pager-model"></akm-pagination>
      </div>
    </div>
    <div id="chart-model" class="p-4 flex items-center" style="height:260px">

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">

    <div class="px-4 py-3 border-b border-border flex items-center justify-between gap-3 flex-wrap">

        <akm-range-tabs id="view-source"></akm-range-tabs>
      </div>
    </div>
    <div id="table-source" class="hidden flex-col" style="height:260px">
      <div class="flex-1 min-h-0">
        <table class="w-full text-sm table-fixed"><colgroup id="cg-source"><col style="width:30%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:14%"></colgroup><tbody id="tbl-source"></tbody></table>
      </div>
      <div id="pagerwrap-source" class="hidden shrink-0 border-t border-border px-3 py-1 items-center justify-end">
        <akm-pagination id="pager-source"></akm-pagination>
      </div>
    </div>
    <div id="chart-source" class="p-4 flex items-center" style="height:260px">
      <akm-donut-chart id="donut-source" class="w-full"></akm-donut-chart>
    </div>
  </div>
  <div id="error-section" class="bg-surface-light border border-border rounded-lg overflow-hidden flex flex-col">
    <!-- 头部强制单行：右侧摘要在宽度不够时省略号截断（hover 看全文），避免换行把卡片撑高 -->
    <div class="px-4 py-3 border-b border-border flex items-center justify-between gap-3 shrink-0">
      <div class="flex items-center gap-3 shrink-0">

        <akm-range-tabs id="error-metric-tabs"></akm-range-tabs>

  </div>

    <akm-line-chart id="daily-chart" class="w-full"></akm-line-chart>

<!-- 插件首页卡片区（通用插槽：启用且实现 dashboard_card() 的插件卡片，宿主统一渲染；无卡片时为空串） -->
{{ plugin_cards_html }}
</div>

{% block extra_js %}
<script>
function esc(s) { if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtNum(n) {
  if (n == null) return '-';
  if (n < 1000) return n.toString();
  if (n < 1000000) return (n / 1000).toFixed(2) + 'K';
  return (n / 1000000).toFixed(2) + 'M';
}
function fmtMoney(n) {
  var v = Number(n || 0);
  return Number.isFinite(v) ? v.toFixed(2) : '0.00';
}
function fmtCost(n, currency, costsByCurrency) {
  return '$' + fmtMoney(n);
}
// 费用明细 tooltip 文本：输入未命中缓存 / 缓存命中 / 输出 的 token 数与价格
// tooltip 内的价格保留 4 位小数，方便观察小额明细（表格内的费用仍保持 2 位）。
function fmtCostDetailTip(v) {
  // 局部格式化：费用保留 4 位小数
  var fmt4 = function(n) { var x = Number(n || 0); return Number.isFinite(x) ? x.toFixed(4) : '0.0000'; };
  var d = (v && v.cost_detail) || {};
  var get = function(k) { return (d[k] || { tokens: 0, cost: 0 }); };
  var im = get('input_missed');
  var ic = get('input_cached');
  var op = get('output');
  // 缓存命中率：命中缓存 token /（未命中输入 + 命中缓存）token，无输入时显示 -
  var inTotal = im.tokens + ic.tokens;
  var hitRate = inTotal > 0 ? (ic.tokens / inTotal * 100).toFixed(1) + '%' : '-';
  return '输入: ' + fmtNum(im.tokens) + ' / $' + fmt4(im.cost) + '\n'
    + '缓存: ' + fmtNum(ic.tokens) + ' / $' + fmt4(ic.cost) + '\n'
    + '输出: ' + fmtNum(op.tokens) + ' / $' + fmt4(op.cost) + '\n'
    + '缓存命中率: ' + hitRate;
}
// 信息图标 SVG：由 akm-tooltip 组件包裹，hover 时显示费用明细浮层
function costTipIcon(v) {
  var tip = fmtCostDetailTip(v);
  return '<akm-tooltip content="' + esc(tip) + '">'
    + '<svg class="w-3.5 h-3.5 ml-1 inline-block align-[-2px] cursor-help text-gray-500 hover:text-rose-300 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16v-4M12 8h.01"/></svg>'
    + '</akm-tooltip>';
}
// 根据是否开启费用估算，动态生成按 Key / 按模型 / 按来源表格的 colgroup 列宽
function syncTableCols(costOn) {
  var html = costOn
    ? '<col style="width:30%"><col style="width:12%"><col style="width:28%"><col style="width:30%">'
    : '<col style="width:30%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:14%"><col style="width:14%">';
  ['cg-provider', 'cg-model', 'cg-source'].forEach(function(id) {
    var cg = document.getElementById(id);
    if (cg) cg.innerHTML = html;
  });
}

// 分桶表按 Token 总量降序分页展示（复用 akm-pagination），表格区不再内部滚动，
// 避免整页出现多个滚动条。每页 6 行，正好落在 260px 卡片体（扣掉分页条）里。
var BUCKET_PAGE_SIZE = 6;
var _bucketPage = { key: 1, model: 1, source: 1 };
var _bucketTotalPages = { key: 1, model: 1, source: 1 };

function bucketEntries(store) {
  return Object.keys(store || {}).map(function(name) {
    return { name: name, item: store[name] || {} };
  }).sort(function(a, b) { return (b.item.total || 0) - (a.item.total || 0); });
}

// 单行：费用开启时「名称/请求次数/Token 总用量/费用」，否则展开输入/输出/缓存明细。
function bucketRowHtml(k, v, costOn) {
  return costOn
    ? '<tr class="border-t border-border hover:bg-surface-hover"><td class="px-4 py-2 text-xs text-gray-300 truncate" title="' + esc(k) + '">' + esc(k) + '</td><td class="px-4 py-2 text-xs text-right text-gray-500 whitespace-nowrap">' + v.requests + '次</td><td class="px-4 py-2 text-xs text-right text-indigo-300">' + fmtNum(v.total) + '</td><td class="px-4 py-2 text-xs text-right text-rose-300 whitespace-nowrap">' + esc(fmtCost(v.cost, v.currency, v.costs_by_currency)) + costTipIcon(v) + '</td></tr>'
    : '<tr class="border-t border-border hover:bg-surface-hover"><td class="px-4 py-2 text-xs text-gray-300 truncate" title="' + esc(k) + '">' + esc(k) + '</td><td class="px-4 py-2 text-xs text-right text-gray-500 whitespace-nowrap">' + v.requests + '次</td><td class="px-4 py-2 text-xs text-right text-indigo-300">' + fmtNum(v.total) + '</td><td class="px-4 py-2 text-xs text-right text-gray-400">' + fmtNum(v.prompt) + '</td><td class="px-4 py-2 text-xs text-right text-gray-400">' + fmtNum(v.completion) + '</td><td class="px-4 py-2 text-xs text-right text-teal-400">' + fmtNum(v.cached || 0) + '</td></tr>';
}

// 单张卡片的分桶表：只渲染当前页的行 + 更新分页条（不动视图可见性）
function renderBucketTable(panel) {
  var entries = bucketEntries(_bucketStores[panel.store]);
  var totalPages = Math.max(1, Math.ceil(entries.length / BUCKET_PAGE_SIZE));
  _bucketTotalPages[panel.id] = totalPages;
  // 数据刷新后行数可能变少，页码夹回合法范围
  var page = Math.min(Math.max(1, _bucketPage[panel.id] || 1), totalPages);
  _bucketPage[panel.id] = page;
  var slice = entries.slice((page - 1) * BUCKET_PAGE_SIZE, page * BUCKET_PAGE_SIZE);
  var tbody = document.getElementById(panel.id === 'key' ? 'tbl-provider' : 'tbl-' + panel.id);
  if (tbody) {
    tbody.innerHTML = slice.length
      ? slice.map(function(entry) { return bucketRowHtml(entry.name, entry.item, _bucketCostOn); }).join('')
      : '<tr><td colspan="' + (_bucketCostOn ? 4 : 6) + '" class="px-4 py-8 text-center text-gray-600 text-xs">暂无数据</td></tr>';
  }
  var pager = document.getElementById('pager-' + panel.id);
  if (pager && typeof pager.renderPagination === 'function') {
    pager.renderPagination({
      totalPages: totalPages,
      currentPage: page,
      onSelectName: 'switchBucketPage_' + panel.id,
      summary: entries.length + ' 项'
    });
  }
}

function setBucketPage(panelId, page) {
  var panel = null;
  BUCKET_PANELS.forEach(function(item) { if (item.id === panelId) panel = item; });
  if (!panel) return;
  var clamped = Math.min(Math.max(1, parseInt(page, 10) || 1), _bucketTotalPages[panelId] || 1);
  if (clamped === _bucketPage[panelId]) return;
  _bucketPage[panelId] = clamped;
  renderBucketTable(panel);
}

function setVisible(el, show, asFlex) {
  if (!el) return;
  el.classList.toggle('hidden', !show);
  if (asFlex) el.classList.toggle('flex', show);
}

var _currentDays = 1;
var DASHBOARD_DAYS_KEY = 'akm_dashboard_days';

// 趋势卡片指标：报错次数 / 成功率 / P95 延迟（三者同桶同口径，后端一次算好）
var _currentMetric = 'errors';
var DASHBOARD_METRIC_KEY = 'akm_dashboard_metric';
var TREND_METRICS = {
  errors:  { label: '报错次数', title: '报错趋势', color: '#f87171', unit: '次', emptyText: '该时段无报错' },
  success: { label: '成功率',   title: '成功率',   color: '#34d399', unit: '%',  emptyText: '该时段无请求' },
  latency: { label: 'P95 延迟', title: 'P95 延迟', color: '#fbbf24', unit: 'ms', emptyText: '该时段无成功请求' }
};

// 延迟友好显示：>=1s 用秒，避免 4~5 位数字挤在提示里
function fmtMs(v) {
  var n = Number(v);
  if (!isFinite(n) || n < 0) return '-';
  if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 's';
  return Math.round(n) + 'ms';
}

function loadMetricFilter() {
  try {
    var saved = localStorage.getItem(DASHBOARD_METRIC_KEY);
    if (saved && TREND_METRICS[saved]) _currentMetric = saved;
  } catch (e) {}
}

function saveMetricFilter() {
  try {
    localStorage.setItem(DASHBOARD_METRIC_KEY, _currentMetric);
  } catch (e) {}
}

function renderMetricTabs() {
  var tabs = document.getElementById('error-metric-tabs');
  if (!tabs || typeof tabs.setOptions !== 'function') return;
  tabs.setOptions(['errors', 'success', 'latency'].map(function(key) {
    return { value: key, label: TREND_METRICS[key].label };
  }), _currentMetric, 'switchMetric');
}

function switchMetric(metric) {
  if (!TREND_METRICS[metric] || metric === _currentMetric) return;
  _currentMetric = metric;
  saveMetricFilter();
  renderMetricTabs();
  // 指标切换只重绘图表，不重新请求接口（数据已在同一份 series 里）
  renderTrendSeries(_lastTrendSeries);
}

// 各指标取哪个字段（成功率 / 延迟缺样本时按 0 画，提示里另行说明）
function metricValue(item, metric) {
  if (metric === 'success') return item.success_rate == null ? 0 : Number(item.success_rate);
  if (metric === 'latency') return item.p95_ms == null ? 0 : Number(item.p95_ms);
  return Number(item.count) || 0;
}

function metricDetailLines(item, metric) {
  var requests = Number(item.requests) || 0;
  var success = Number(item.success) || 0;
  var failed = item.failed == null ? Math.max(0, requests - success) : Number(item.failed);
  if (metric === 'success') {
    if (!requests) return ['该时段无请求'];
    return [success + ' / ' + requests + ' 成功 · ' + failed + ' 失败'];
  }
  if (metric === 'latency') {
    if (item.p95_ms == null) return ['该时段无成功请求'];
    return [
      'P50 ' + fmtMs(item.p50_ms) + ' · 平均 ' + fmtMs(item.avg_ms),
      '成功 ' + success + ' / ' + requests + ' 请求'
    ];
  }
  var lines = (item.top_errors || []).map(function(err) {
    return err.count + '× ' + err.message;
  });
  // 以 count 为准判断有没有失败：requests/failed 缺失（例如后端版本较旧）时不误报「无失败请求」
  if (!lines.length) lines.push(Number(item.count) ? '无报错详情' : '该时段无失败请求');
  return lines;
}

function renderTrendSeries(series) {
  var metric = TREND_METRICS[_currentMetric] || TREND_METRICS.errors;
  var titleEl = document.getElementById('error-title');
  if (titleEl) titleEl.textContent = metric.title;
  var chart = document.getElementById('error-chart');
  if (chart && typeof chart.render === 'function' && series) {
    chart.render({
      labels: series.map(function(item) { return item.label; }),
      values: series.map(function(item) { return metricValue(item, _currentMetric); }),
      details: series.map(function(item) { return metricDetailLines(item, _currentMetric); }),
      format: _currentMetric === 'latency'
        ? function(v) { return fmtMs(v); }
        : (_currentMetric === 'success'
          ? function(v) { return (Number(v) || 0).toFixed(2) + '%'; }
          : null),
      height: 220,
      maxHeight: 260,
      fill: true,
      color: metric.color,
      unit: metric.unit,
      emptyText: metric.emptyText
    });
  }
  var summaryEl = document.getElementById('error-summary');
  if (summaryEl && series) {
    var stats = _lastTrendStats || {};
    var bucketText = _lastTrendBucket === 'hour' ? '今日按小时' : ('近' + _currentDays + '天按天');
    var summaryText;
    if (_currentMetric === 'success') {
      summaryText = stats.success_rate == null
        ? bucketText + ' · 无请求'
        : bucketText + ' · 成功率 ' + stats.success_rate.toFixed(2) + '%';
    } else if (_currentMetric === 'latency') {
      summaryText = stats.p95_ms == null
        ? bucketText + ' · 无成功请求'
        : bucketText + ' · P95 ' + fmtMs(stats.p95_ms) + ' · P50 ' + fmtMs(stats.p50_ms);
    } else {
      summaryText = bucketText + ' · 共 ' + (Number(_lastTrendTotal) || 0) + ' 次失败';
    }
    // 头部只有一行：超宽时 CSS 截断，全文放 title 里 hover 可见
    summaryEl.textContent = summaryText;
    summaryEl.title = summaryText;
  }
}

var _lastTrendSeries = null;
var _lastTrendBucket = 'hour';
var _lastTrendStats = {};
var _lastTrendTotal = 0;

// 按 Key / 按模型 / 按来源三张卡片：同一份分桶数据，支持「表 / 图」切换
// （默认图），图表为环形图，指标可在 请求 / Token / 费用 间切换（三张卡共享同一指标）。
var BUCKET_PANELS = [
  { id: 'key', store: 'by_key' },
  { id: 'model', store: 'by_model' },
  { id: 'source', store: 'by_source' }
];
// 「图 / 表」用图标表达：柱状图 = 图表视图，表格网格 = 表格视图（内联 SVG，跟随按钮文字色）。
var BUCKET_VIEW_ICONS = {
  chart: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>',
  table: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>'
};
var DASHBOARD_BUCKET_KEY = 'akm_dashboard_bucket_view';
var _bucketView = { key: 'chart', model: 'chart', source: 'chart' };
// 每张卡片各记一个指标，互不影响（Token / 请求 / 费用）
var _bucketMetricOf = { key: 'requests', model: 'requests', source: 'requests' };
var _bucketCostOn = false;
var _bucketStores = {};
var _bucketMetrics = {
  requests: { label: '请求', unit: '次', format: function(v) { return String(Math.round(Number(v) || 0)); } },
  total: { label: 'Token', unit: '', format: function(v) { return fmtNum(v); } },
  cost: { label: '费用', unit: '', format: function(v) { return '$' + fmtMoney(v); } }
};

function loadBucketView() {
  try {
    var raw = localStorage.getItem(DASHBOARD_BUCKET_KEY);
    if (!raw) return;
    var saved = JSON.parse(raw) || {};
    BUCKET_PANELS.forEach(function(panel) {
      var entry = saved[panel.id];
      // 兼容早期版本：视图曾是字符串，指标曾是三卡共享的顶层字段
      var view = typeof entry === 'string' ? entry : (entry && entry.view);
      if (view === 'table' || view === 'chart') _bucketView[panel.id] = view;
      var metric = entry && typeof entry === 'object' ? entry.metric : saved.metric;
      if (_bucketMetrics[metric]) _bucketMetricOf[panel.id] = metric;
    });
  } catch (e) {}
}

function saveBucketView() {
  try {
    var payload = {};
    BUCKET_PANELS.forEach(function(panel) {
      payload[panel.id] = { view: _bucketView[panel.id], metric: _bucketMetricOf[panel.id] };
    });
    localStorage.setItem(DASHBOARD_BUCKET_KEY, JSON.stringify(payload));
  } catch (e) {}
}

function bucketMetricOptions() {
  var options = [
    { value: 'total', label: _bucketMetrics.total.label },
    { value: 'requests', label: _bucketMetrics.requests.label }
  ];
  if (_bucketCostOn) options.push({ value: 'cost', label: _bucketMetrics.cost.label });
  return options;
}

function renderBucketTabs() {
  BUCKET_PANELS.forEach(function(panel) {
    var viewTabs = document.getElementById('view-' + panel.id);
    if (viewTabs && typeof viewTabs.setOptions === 'function') {
      viewTabs.setOptions([
        { value: 'chart', label: '图', icon: BUCKET_VIEW_ICONS.chart, title: '图表' },
        { value: 'table', label: '表', icon: BUCKET_VIEW_ICONS.table, title: '表格' }
      ], _bucketView[panel.id], 'switchBucketView_' + panel.id);
    }
    var metricTabs = document.getElementById('metric-' + panel.id);
    if (metricTabs && typeof metricTabs.setOptions === 'function') {
      metricTabs.setOptions(bucketMetricOptions(), _bucketMetricOf[panel.id], 'switchBucketMetric_' + panel.id);
    }
    // 表模式下没有指标可切，用 invisible 占位保持头部高度不变（切换不跳高）
    var wrap = document.getElementById('metricwrap-' + panel.id);
    if (wrap) wrap.classList.toggle('invisible', _bucketView[panel.id] !== 'chart');
  });
}

function setBucketView(panelId, view) {
  if (view !== 'table' && view !== 'chart') return;
  if (_bucketView[panelId] === view) return;
  _bucketView[panelId] = view;
  saveBucketView();
  applyBucketLayout();
}

function setBucketMetric(panelId, metric) {
  if (!_bucketMetrics[metric] || _bucketMetricOf[panelId] === metric) return;
  _bucketMetricOf[panelId] = metric;
  saveBucketView();
  renderBucketTabs();
  renderBucketCharts();
}

// 环形图数据项：数值 + 悬浮明细。
// 明细与表格保持一致：费用开启时给「费用 + 费用拆解（含价格与缓存命中率）」，
// 未开启时给「输入 / 输出 / 缓存」Token 构成（这三项不依赖费用估算，表格非费用模式也是这几列）。
function bucketItemDetails(item) {
  var lines = ['请求 ' + (item.requests || 0) + ' 次 · Token ' + fmtNum(item.total || 0)];
  if (_bucketCostOn) {
    lines.push('费用 ' + fmtCost(item.cost, item.currency, item.costs_by_currency));
    if (item.cost_detail) {
      fmtCostDetailTip(item).split('\n').forEach(function(line) { lines.push(line); });
    }
  } else {
    lines.push('输入 ' + fmtNum(item.prompt || 0) + ' · 输出 ' + fmtNum(item.completion || 0) + ' · 缓存 ' + fmtNum(item.cached || 0));
  }
  return lines;
}

function renderBucketCharts() {
  BUCKET_PANELS.forEach(function(panel) {
    var donut = document.getElementById('donut-' + panel.id);
    if (!donut || typeof donut.render !== 'function') return;
    var metricKey = _bucketMetricOf[panel.id];
    var metric = _bucketMetrics[metricKey] || _bucketMetrics.requests;
    var store = _bucketStores[panel.store] || {};
    donut.render({
      items: Object.keys(store).map(function(name) {
        var item = store[name] || {};
        return {
          label: name,
          value: item[metricKey],
          details: bucketItemDetails(item)
        };
      }),
      unit: metric.unit,
      format: metric.format,
      maxSlices: 6,
      size: 168,
      centerLabel: metric.label + '合计',
      emptyText: '暂无数据'
    });
  });
}

// 切换「表 / 图」只动显隐与图表，不重建表格 DOM（分页与页码都保留）
function applyBucketLayout() {
  BUCKET_PANELS.forEach(function(panel) {
    var showChart = _bucketView[panel.id] === 'chart';
    setVisible(document.getElementById('table-' + panel.id), !showChart, true);
    setVisible(document.getElementById('chart-' + panel.id), showChart, true);
    // 分页条只在表视图、且确实多于 1 页时出现
    setVisible(document.getElementById('pagerwrap-' + panel.id), !showChart && (_bucketTotalPages[panel.id] || 1) > 1, true);
  });
  renderBucketTabs();
  renderBucketCharts();
}

function renderBuckets(stores, costOn) {
  _bucketStores = stores || {};
  _bucketCostOn = costOn === true;
  // 关闭费用估算后，「费用」指标不再可选，逐卡回落到「请求」
  if (!_bucketCostOn) {
    BUCKET_PANELS.forEach(function(panel) {
      if (_bucketMetricOf[panel.id] === 'cost') _bucketMetricOf[panel.id] = 'requests';
    });
  }
  BUCKET_PANELS.forEach(renderBucketTable);
  applyBucketLayout();
}

function loadDaysFilter() {
  if (window.__akmDashboardInitialDays === 1 || window.__akmDashboardInitialDays === 7 || window.__akmDashboardInitialDays === 30) {
    _currentDays = window.__akmDashboardInitialDays;
    return;
  }
  try {
    var saved = parseInt(localStorage.getItem(DASHBOARD_DAYS_KEY) || '1', 10);
    if (saved === 1 || saved === 7 || saved === 30) {
      _currentDays = saved;
    }
  } catch (e) {}
}

function saveDaysFilter() {
  try {
    localStorage.setItem(DASHBOARD_DAYS_KEY, String(_currentDays));
  } catch (e) {}
}

function switchDays(d) {
  _currentDays = d;
  saveDaysFilter();
  var tabs = document.getElementById('dashboard-days');
  if (tabs && typeof tabs.setOptions === 'function') {
    tabs.setOptions([
      { value: 1, label: '1d' },
      { value: 7, label: '7d' },
      { value: 30, label: '30d' }
    ], _currentDays, 'switchDays');
  }
  loadDashboard();
}

// ── 每日用量 ──
// 1d 只有今天一天，与上面的报错趋势 / 按来源重复，整块不显示；
// 7d / 30d 改成整行折线图，三条线：总 Token（左轴）、成功率与缓存命中率（右轴，固定 0~100%）；
// 没有请求的自然日率值按 0 画（直接落到基线，不做插值/断线）。
// 口径与后端一致：daily 与 errors.series 都是「最近 N 个自然日、升序」，
// 因此按同一个下标取用量与成功率，不用做日期字符串对齐。
function renderDailyChart(s) {
  var section = document.getElementById('daily-section');
  var chart = document.getElementById('daily-chart');
  if (!section || !chart) return;
  if (_currentDays <= 1 || typeof chart.render !== 'function') {
    section.classList.add('hidden');
    return;
  }
  var trend = (s.errors && Array.isArray(s.errors.series)) ? s.errors.series : [];
  var daily = s.daily || {};
  var today = new Date();
  var labels = [], tokens = [], successRates = [], cacheRates = [];
  for (var i = 0; i < _currentDays; i++) {
    var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (_currentDays - 1 - i));
    var mm = ('0' + (d.getMonth() + 1)).slice(-2);
    var dd = ('0' + d.getDate()).slice(-2);
    labels.push(mm + '-' + dd);
    var item = daily[d.getFullYear() + '-' + mm + '-' + dd] || null;
    var prompt = item ? Number(item.prompt) || 0 : 0;
    var cached = item ? Number(item.cached) || 0 : 0;
    var inputTotal = prompt + cached;
    tokens.push(item ? Number(item.total) || 0 : 0);
    // 无请求的自然日：率值没有分母，按 0 画在基线（不插值、不断线），一眼能看出那几天没请求
    successRates.push(trend[i] && trend[i].success_rate != null ? Number(trend[i].success_rate) : 0);
    // 缓存命中率口径与费用 tooltip 一致：命中缓存 /（未命中输入 + 命中缓存）
    cacheRates.push(inputTotal > 0 ? cached * 100 / inputTotal : 0);
  }
  section.classList.remove('hidden');
  chart.render({
    labels: labels,
    series: [
      { label: '总 Token', values: tokens, color: '#818cf8', axis: 'tokens', area: true, format: function(v) { return fmtNum(v); } },
      { label: '成功率', values: successRates, color: '#34d399', axis: 'percent', format: function(v) { return v.toFixed(2) + '%'; } },
      { label: '缓存命中率', values: cacheRates, color: '#22d3ee', axis: 'percent', format: function(v) { return v.toFixed(1) + '%'; } }
    ],
    axes: [
      { id: 'tokens', side: 'left', format: function(v) { return fmtNum(v); } },
      { id: 'percent', side: 'right', min: 0, max: 100, format: function(v) { return Math.round(v) + '%'; } }
    ],
    height: 220,
    maxHeight: 260,
    fill: true,
    emptyText: '该时段暂无用量'
  });
}

async function loadDashboard() {
  // 显示骨架屏，隐藏真实内容
  document.getElementById('dashboard-skeleton').classList.remove('hidden');
  document.getElementById('dashboard-content').classList.add('hidden');
  try {
    var res = await fetch('/api/stats?days=' + _currentDays);
    var s = await res.json();
    var costOn = s.cost_stats_enabled === true;
    var cards = document.getElementById('stats-cards');
    var skCost = document.getElementById('sk-cost');
    var costCard = document.getElementById('stat-cost-card');
    if (costOn) {
      cards.className = 'grid grid-cols-2 lg:grid-cols-6 gap-4 mb-6';
      document.getElementById('skeleton-stats').className = 'grid grid-cols-2 lg:grid-cols-6 gap-4 mb-6';
      costCard.classList.remove('hidden');
      if (skCost) skCost.classList.remove('hidden');
      document.getElementById('stat-cost').textContent = fmtCost(
        s.total_cost, s.cost_currency, s.costs_by_currency
      );
    } else {
      cards.className = 'grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6';
      document.getElementById('skeleton-stats').className = 'grid grid-cols-2 lg:grid-cols-5 gap-4 mb-6';
      costCard.classList.add('hidden');
      if (skCost) skCost.classList.add('hidden');
    }
    document.getElementById('stat-requests').textContent = s.total_requests.toLocaleString();
    document.getElementById('stat-total').textContent = fmtNum(s.total_tokens);
    document.getElementById('stat-prompt').textContent = fmtNum(s.total_prompt_tokens);
    document.getElementById('stat-completion').textContent = fmtNum(s.total_completion_tokens);
    document.getElementById('stat-cached').textContent = fmtNum(s.total_cached_tokens || 0);
    document.getElementById('stat-cached-at').textContent = s.cached_at ? '更新时间 ' + s.cached_at : '';

    syncTableCols(costOn);
    renderBuckets({ by_key: s.by_key, by_model: s.by_model, by_source: s.by_source }, costOn);

    // ── 报错趋势 / 成功率 / P95 延迟：days=1 按小时（24 点），7/30 天按自然日 ──
    var errors = s.errors || {};
    var series = Array.isArray(errors.series) ? errors.series : [];
    _lastTrendSeries = series;
    _lastTrendBucket = errors.bucket || 'hour';
    _lastTrendStats = errors.stats || {};
    _lastTrendTotal = errors.total || 0;
    renderMetricTabs();
    renderTrendSeries(series);

    renderDailyChart(s);
    // 数据加载完成，隐藏骨架屏
    document.getElementById('dashboard-skeleton').classList.add('hidden');
    document.getElementById('dashboard-content').classList.remove('hidden');
  } catch(e) { console.error('Dashboard:', e); }
}

document.addEventListener('DOMContentLoaded', function() {
  loadDaysFilter();
  loadMetricFilter();
  loadBucketView();
  // akm-range-tabs 通过 window[回调名] 回传，按卡片各生成一个回调
  BUCKET_PANELS.forEach(function(panel) {
    window['switchBucketView_' + panel.id] = function(view) { setBucketView(panel.id, view); };
    window['switchBucketMetric_' + panel.id] = function(metric) { setBucketMetric(panel.id, metric); };
    window['switchBucketPage_' + panel.id] = function(page) { setBucketPage(panel.id, page); };
  });
  var tabs = document.getElementById('dashboard-days');
  if (tabs && typeof tabs.setOptions === 'function') {
    tabs.setOptions([
      { value: 1, label: '1d' },
      { value: 7, label: '7d' },
      { value: 30, label: '30d' }
    ], _currentDays, 'switchDays');
  }
  switchDays(_currentDays);

  // 当管理台页面曾切到后台、随后再次回到前台时，重新拉取一次统计数据。
  // 这样可以避免用户长时间停留在其他标签页后返回统计页时仍看到旧数据，
  // 同时只在页面真正变为可见时触发，避免后台标签页继续发起无意义请求。
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      loadDashboard();
    }
  });
});
</script>
