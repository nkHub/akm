<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/logo.png?v={{ asset_version }}">
<title>AKM - {{ title }}</title>
<script src="/static/tailwindcss.js?v={{ asset_version }}"></script>
<script src="/static/marked.min.js?v={{ asset_version }}"></script>
<script src="/static/akm-ui.js?v={{ asset_version }}"></script>
<script>
try {
  if (localStorage.getItem('akm.sidebar.collapsed') === '1') {
    document.documentElement.classList.add('sidebar-collapsed');
  }
} catch (e) {}

/* 主题：深色是默认（原有配色），可切浅色或跟随系统。
   data-theme 必须在首次绘制前落到 <html> 上，否则会先闪一下默认色再跳成浅色；
   具体的色值在 _styles.html 的 token 里（html / html[data-theme="light"]）。 */
(function() {
  var THEME_KEY = 'akm.theme';
  var stored = 'dark';
  try { stored = localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) {}

  window.__akmTheme = {
    key: THEME_KEY,
    icons: {
      system: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
      light: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      dark: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
    },
    get: function() { return stored; },
    set: function(value) { stored = value === 'light' || value === 'system' ? value : 'dark'; },
    resolved: function() {
      if (stored !== 'system') return stored;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    },
    apply: function() {
      var resolved = window.__akmTheme.resolved();
      var root = document.documentElement;
      root.setAttribute('data-theme', resolved);
      root.classList.toggle('dark', resolved === 'dark');
      root.classList.toggle('light', resolved === 'light');
      root.style.colorScheme = resolved;
      // 广播给同页的监听者（插件宿主页据此通知 iframe 内的插件前端）
      try {
        window.dispatchEvent(new CustomEvent('akm:theme', { detail: { theme: stored, resolved: resolved } }));
      } catch (e) {}
    }
  };
  window.__akmTheme.apply();

  // 跟随系统时，系统外观变化要实时生效
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    var onSchemeChange = function() { if (window.__akmTheme.get() === 'system') window.__akmTheme.apply(); };
    if (mq.addEventListener) mq.addEventListener('change', onSchemeChange);
    else if (mq.addListener) mq.addListener(onSchemeChange);
  }
})();

tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        surface: {
          DEFAULT: 'rgb(var(--c-surface) / <alpha-value>)',
          light: 'rgb(var(--c-surface-light) / <alpha-value>)',
          hover: 'rgb(var(--c-surface-hover) / <alpha-value>)',
        },
        border: {
          DEFAULT: 'rgb(var(--c-border) / <alpha-value>)',
          light: 'rgb(var(--c-border-light) / <alpha-value>)',
        },
        // 卡片标题一类「落在 surface 上」的强调文字；按钮上用在实心强调色背景上的仍是 text-white
        strong: 'rgb(var(--c-text-strong) / <alpha-value>)',
        'switch-off': 'rgb(var(--c-switch-off) / <alpha-value>)',
        // 中性文字档位接 token；实心强调色按钮档（*-500/600）保持 Tailwind 原值，
        // 深浅两套主题下都在强调色底上配 text-white
        gray: {
          200: 'rgb(var(--c-gray-200) / <alpha-value>)',
          300: 'rgb(var(--c-gray-300) / <alpha-value>)',
          400: 'rgb(var(--c-gray-400) / <alpha-value>)',
          500: 'rgb(var(--c-gray-500) / <alpha-value>)',
          600: 'rgb(var(--c-gray-600) / <alpha-value>)',
        },
        indigo: { 200: 'rgb(var(--c-indigo-200) / <alpha-value>)', 300: 'rgb(var(--c-indigo-300) / <alpha-value>)', 400: 'rgb(var(--c-indigo-400) / <alpha-value>)', 950: 'rgb(var(--c-indigo-950) / <alpha-value>)' },
        red: {
          300: 'rgb(var(--c-red-300) / <alpha-value>)',
          400: 'rgb(var(--c-red-400) / <alpha-value>)',
          800: 'rgb(var(--c-red-800) / <alpha-value>)',
          900: 'rgb(var(--c-red-900) / <alpha-value>)',
          950: 'rgb(var(--c-red-950) / <alpha-value>)',
        },
        amber: {
          300: 'rgb(var(--c-amber-300) / <alpha-value>)',
          400: 'rgb(var(--c-amber-400) / <alpha-value>)',
          800: 'rgb(var(--c-amber-800) / <alpha-value>)',
          900: 'rgb(var(--c-amber-900) / <alpha-value>)',
          950: 'rgb(var(--c-amber-950) / <alpha-value>)',
        },
        emerald: { 300: 'rgb(var(--c-emerald-300) / <alpha-value>)', 400: 'rgb(var(--c-emerald-400) / <alpha-value>)', 950: 'rgb(var(--c-emerald-950) / <alpha-value>)' },
        green: { 300: 'rgb(var(--c-green-300) / <alpha-value>)', 400: 'rgb(var(--c-green-400) / <alpha-value>)', 950: 'rgb(var(--c-green-950) / <alpha-value>)' },
        cyan: { 300: 'rgb(var(--c-cyan-300) / <alpha-value>)', 400: 'rgb(var(--c-cyan-400) / <alpha-value>)' },
        teal: { 400: 'rgb(var(--c-teal-400) / <alpha-value>)' },
        purple: { 400: 'rgb(var(--c-purple-400) / <alpha-value>)' },
        rose: { 300: 'rgb(var(--c-rose-300) / <alpha-value>)', 400: 'rgb(var(--c-rose-400) / <alpha-value>)' },
        yellow: { 300: 'rgb(var(--c-yellow-300) / <alpha-value>)', 400: 'rgb(var(--c-yellow-400) / <alpha-value>)' },
        blue: { 400: 'rgb(var(--c-blue-400) / <alpha-value>)' },
      }
    }
  }
}
</script>
{% include "_styles.html" %}
</head>
<body class="bg-surface text-gray-200 h-screen flex overflow-hidden">
{% include "_sidebar.html" %}
<div class="flex-1 flex flex-col min-w-0 overflow-hidden">
{% include "_header.html" %}
<main class="flex-1 overflow-y-auto p-6">
{% block content %}{% endblock %}
</main>
</div>
{% block extra_html %}{% endblock %}
{% block extra_js %}{% endblock %}
{% include "_theme.html" %}
{% include "_toggle_sidebar.html" %}
</body>
</html>
