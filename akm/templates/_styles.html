<style>
  /* ── 主题 token ──────────────────────────────────────────────────────────
     深色是默认值（也就是原来的配色），浅色由 html[data-theme="light"] 覆盖。
     Tailwind 那边（_layout.html 的 tailwind.config）把这些 token 映射成
     surface / border / gray-* / 各强调色，所以换主题只换这里的值，
     模板里不需要出现任何 dark: 变体。
     写法约定：颜色用 "R G B" 三段空格分隔，Tailwind 侧配合
     rgb(var(--x) / <alpha-value>) 才能继续支持 bg-surface/50 这类透明度。
     强调色的实心按钮档（indigo-500/600、red-500/600、amber-500/600、
     emerald-500/600 等）两套主题共用，不在这里列。 */
  html {
    color-scheme: dark;
    /* 面：surface 页面底、surface-light 卡片/侧栏、surface-hover 悬停 */
    --c-surface: 30 30 46;
    --c-surface-light: 38 38 55;
    --c-surface-hover: 45 45 64;
    --c-border: 51 51 77;
    --c-border-light: 64 64 96;
    --c-text-strong: 255 255 255;
    /* 中性文字：gray-200 正文 → gray-600 最淡 */
    --c-gray-200: 229 231 235;
    --c-gray-300: 209 213 219;
    --c-gray-400: 156 163 175;
    --c-gray-500: 107 114 128;
    --c-gray-600: 75 85 99;
    --c-switch-off: 75 85 99;
    /* 细节 */
    --c-scrollbar: 64 64 96;
    --c-overlay-weak: 255 255 255;
    --c-code-bg: 13 13 26;
    --c-code-border: 51 51 51;
    --c-quote-border: 85 85 85;
    --c-quote-text: 153 153 153;
    --c-skeleton: 42 42 58;
    --c-chart-dot: 30 30 46;
    /* 悬浮提示 / 通知卡：本身是浮层，深色下维持原来的深底浅字 */
    --c-tooltip-bg: 17 24 39;
    --c-tooltip-border: 55 65 81;
    --c-tooltip-text: 209 213 219;
    --c-tooltip-title: 249 250 251;
    --c-tooltip-muted: 156 163 175;
    /* 强调色的文字/淡底/淡边档位（浅色下要压深或提亮，深色用 Tailwind 原值） */
    --c-indigo-200: 199 210 254;
    --c-indigo-300: 165 180 252;
    --c-indigo-400: 129 140 248;
    --c-indigo-950: 30 27 75;
    --c-red-300: 252 165 165;
    --c-red-400: 248 113 113;
    --c-red-800: 153 27 27;
    --c-red-900: 127 29 29;
    --c-red-950: 69 10 10;
    --c-amber-300: 252 211 77;
    --c-amber-400: 251 191 36;
    --c-amber-800: 146 64 14;
    --c-amber-900: 120 53 15;
    --c-amber-950: 69 26 3;
    --c-emerald-300: 110 231 183;
    --c-emerald-400: 52 211 153;
    --c-emerald-950: 2 44 34;
    --c-green-300: 134 239 172;
    --c-green-400: 74 222 128;
    --c-green-950: 5 46 22;
    --c-cyan-300: 103 232 249;
    --c-cyan-400: 34 211 238;
    --c-teal-400: 45 212 191;
    --c-purple-400: 192 132 252;
    --c-rose-300: 253 164 175;
    --c-rose-400: 251 113 133;
    --c-yellow-300: 253 224 71;
    --c-yellow-400: 250 204 21;
    --c-blue-400: 96 165 250;
  }
  html[data-theme="light"] {
    color-scheme: light;
    /* 浅色下「卡片比页面亮」的方向和深色一致：页面浅灰、卡片纯白 */
    --c-surface: 244 245 248;
    --c-surface-light: 255 255 255;
    --c-surface-hover: 236 238 243;
    --c-border: 223 227 234;
    --c-border-light: 203 210 220;
    --c-text-strong: 17 24 39;
    --c-gray-200: 31 41 55;
    --c-gray-300: 55 65 81;
    --c-gray-400: 75 85 99;
    --c-gray-500: 107 114 128;
    --c-gray-600: 156 163 175;
    --c-switch-off: 148 163 184;
    --c-scrollbar: 203 210 220;
    --c-overlay-weak: 0 0 0;
    --c-code-bg: 243 244 246;
    --c-code-border: 229 231 235;
    --c-quote-border: 209 213 219;
    --c-quote-text: 107 114 128;
    --c-skeleton: 229 231 235;
    --c-chart-dot: 255 255 255;
    --c-tooltip-bg: 255 255 255;
    --c-tooltip-border: 223 227 234;
    --c-tooltip-text: 55 65 81;
    --c-tooltip-title: 17 24 39;
    --c-tooltip-muted: 107 114 128;
    /* 文字档一律压到各家的 600/700 档，淡底/淡边换成 100~300 档 */
    --c-indigo-200: 55 48 163;
    --c-indigo-300: 67 56 202;
    --c-indigo-400: 79 70 229;
    --c-indigo-950: 224 231 255;
    --c-red-300: 185 28 28;
    --c-red-400: 220 38 38;
    --c-red-800: 252 165 165;
    --c-red-900: 254 202 202;
    --c-red-950: 254 226 226;
    --c-amber-300: 180 83 9;
    --c-amber-400: 217 119 6;
    --c-amber-800: 252 211 77;
    --c-amber-900: 253 230 138;
    --c-amber-950: 254 243 199;
    --c-emerald-300: 4 120 87;
    --c-emerald-400: 5 150 105;
    --c-emerald-950: 209 250 229;
    --c-green-300: 21 128 61;
    --c-green-400: 22 163 74;
    --c-green-950: 220 252 231;
    --c-cyan-300: 14 116 144;
    --c-cyan-400: 8 145 178;
    --c-teal-400: 13 148 136;
    --c-purple-400: 124 58 237;
    --c-rose-300: 190 18 60;
    --c-rose-400: 225 29 72;
    --c-yellow-300: 161 98 7;
    --c-yellow-400: 202 138 4;
    --c-blue-400: 37 99 235;
  }
  body { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; }
  /* 图表（akm-line-chart / akm-donut-chart）内部的中性色改成类，
     序列色是强调色、两套主题共用，所以这里只处理会随主题变的部分 */
  .akm-chart-grid { stroke: rgb(var(--c-border)); }
  .akm-chart-tick { fill: rgb(var(--c-gray-500)); }
  .akm-chart-legend { fill: rgb(var(--c-gray-400)); }
  .akm-chart-center-label { fill: rgb(var(--c-gray-500)); }
  .akm-chart-center-value { fill: rgb(var(--c-gray-200)); }
  .akm-chart-dot { fill: rgb(var(--c-chart-dot)); }
  .status-2xx { background: #166534; color: #86efac; }
  .status-4xx { background: #854d0e; color: #fde68a; }
  .status-5xx { background: #991b1b; color: #fecaca; }
  .status-err { background: #4a044e; color: #e9d5ff; }
  .status-active { background: #166534; color: #86efac; }
  .status-disabled { background: #991b1b; color: #fecaca; }
  .status-rate_limited { background: #854d0e; color: #fde68a; }
  .sidebar-transition { transition: width 0.2s ease; }
  html.sidebar-collapsed #sidebar { width: 60px !important; }
  html.sidebar-collapsed .sidebar-label,
  html.sidebar-collapsed .sidebar-brand { display: none !important; }
  .switch-track { width: 44px; height: 24px; border-radius: 12px; transition: background 0.2s; }
  .switch-thumb { width: 18px; height: 18px; border-radius: 50%; transition: transform 0.2s; transform: translateX(3px); }
  .switch-on .switch-thumb { transform: translateX(23px); }
  .drawer { transition: transform 0.25s ease; }
  .drawer-open { transform: translateX(0); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--c-scrollbar)); border-radius: 3px; }
  /* 主内容区始终预留纵向滚动条宽度（选择器带上 Tailwind 的类名以压过 .overflow-y-auto）：
     审计日志翻页 / 切换筛选时行数变化会让滚动条出现或消失，6px 的宽度差会把整页内容
     左右推一下造成抖动。这里固定按 scroll 预留 gutter，并额外声明 scrollbar-gutter，
     滚动条有无都不再改变内容宽度。 */
  main.overflow-y-auto {
    overflow-y: scroll;
    scrollbar-gutter: stable;
  }
  /* Key 列表卡片 / 模型标签的尺寸兜底。
     Tailwind 由 Play CDN 运行时注入样式，而卡片是 JS 后插进 DOM 的；样式表重建往往比
     「模型标签收敛到 2 行」的第一次测量晚一步 —— 那一轮量到的网格列数、标签宽度与行高都
     还不是最终值，于是多留一行标签、下一轮再收回去，每次刷新列表都会上下跳一下。
     这里把「量尺寸相关」的属性写进页面自带的样式（与 Tailwind 的 grid-cols-1 /
     xl:grid-cols-2 / gap-3 / gap-2 / px-1.5 / py-0.5 / text-xs / border / rounded 同值），
     保证第一轮测量就是最终值；Tailwind 注入后同值覆盖，外观不变。
     列数用 .grid[data-key-grid] 提强度：同为单类强度时会被文档顺序更靠后的 .grid-cols-1
     盖回单列（单列 1192px vs 两列 573px），量错宽度同样会多留一行。 */
  .grid[data-key-grid] {
    display: grid;
    grid-template-columns: repeat(1, minmax(0, 1fr));
    gap: 12px;
  }
  @media (min-width: 1280px) {
    .grid[data-key-grid] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  [data-model-tags] {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 8px;
    min-width: 0;
  }
  [data-model-chip],
  [data-model-more] {
    box-sizing: border-box;
    display: inline-block;
    max-width: 100%;
    padding: 2px 6px;
    border: 1px solid rgb(var(--c-border));
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    line-height: 16px;
    word-break: break-all;
  }
  /* 收敛时靠 .hidden 收起放不下的标签；上面把 display 钉成 inline-block，
     这里必须同强度地把 .hidden 钉住，否则样式表晚到的那一瞬标签会全部铺出来 */
  [data-model-chip].hidden,
  [data-model-more].hidden {
    display: none;
  }
  .fade-in { animation: fadeIn 0.15s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  /* 余额 / 用量刷新按钮：查询中让 sync 图标转起来（不依赖 Tailwind 的 animate-spin） */
  .akm-spin { animation: akm-spin 0.9s linear infinite; }
  @keyframes akm-spin { to { transform: rotate(360deg); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .token-number { font-variant-numeric: tabular-nums; }
  /* 避免自定义元素在升级前把原始子节点直接闪到页面上 */
  akm-modal,
  akm-drawer {
    display: contents;
  }
  akm-settings-card {
    display: block;
  }
  akm-plugin-card {
    display: block;
  }
  /* 空状态占位：自定义元素默认 inline，会让 py-8 / text-center / rounded 全部失效 */
  akm-empty-state {
    display: block;
  }
  akm-modal:not([data-ready]),
  akm-drawer:not([data-ready]),
  akm-settings-card:not([data-ready]) {
    display: none;
  }
  /* 首页知识库记忆卡片指标网格 */
  .mk-memory-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px 16px; width: 100%; }
  .mk-mem-item { display: flex; flex-direction: column; gap: 2px; }
  .mk-mem-num { font-size: 1.35rem; font-weight: 600; color: rgb(var(--c-indigo-300)); font-variant-numeric: tabular-nums; }
  .mk-mem-label { font-size: 0.72rem; color: rgb(var(--c-gray-400)); }
  /* 首页插件卡片瀑布流（CSS columns）：卡片按各自高度自然交错排布，不强制同行等高 */
  .plugin-cards-masonry {
    columns: 1;
    column-gap: 1rem;
  }
  .plugin-cards-masonry > * {
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    margin-bottom: 1rem;
  }
  @media (min-width: 768px) {
    .plugin-cards-masonry { columns: 2; }
  }
  @media (min-width: 1280px) {
    .plugin-cards-masonry { columns: 3; }
  }
  /* 聊天 Markdown 渲染 */
  .chat-md p { margin: 0.25em 0; }
  .chat-md p:first-child { margin-top: 0; }
  .chat-md p:last-child { margin-bottom: 0; }
  .chat-md code { background: rgb(var(--c-overlay-weak) / 0.08); padding: 1px 6px; border-radius: 4px; font-size: 0.85em; }
  .chat-md pre { background: rgb(var(--c-code-bg)); border: 1px solid rgb(var(--c-code-border)); border-radius: 6px; padding: 10px 14px; overflow-x: auto; margin: 0.5em 0; font-size: 0.82em; line-height: 1.5; }
  .chat-md pre code { background: none; padding: 0; border-radius: 0; font-size: inherit; }
  .chat-md ul, .chat-md ol { padding-left: 1.5em; margin: 0.25em 0; }
  .chat-md blockquote { border-left: 3px solid rgb(var(--c-quote-border)); padding-left: 12px; color: rgb(var(--c-quote-text)); margin: 0.5em 0; }
  .chat-md table { border-collapse: collapse; margin: 0.5em 0; font-size: 0.85em; }
  .chat-md th, .chat-md td { border: 1px solid rgb(var(--c-border)); padding: 4px 10px; text-align: left; }
  .chat-md th { background: rgb(var(--c-overlay-weak) / 0.06); }
  .chat-md a { color: rgb(var(--c-indigo-400)); text-decoration: underline; }
  .chat-md hr { border-color: rgb(var(--c-code-border)); margin: 0.75em 0; }
  /* 骨架屏动画 */
  @keyframes skeleton-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  /* 分段按钮（akm-range-tabs）在 setOptions 之前是空元素：先占住一行高度，
     否则 JS 跑起来时容器从 0 长到 30px，会把同页下方内容整体顶下去（刷新抖动）。 */
  akm-range-tabs { min-height: 30px; }
  /* 插件卡片初始化前是服务端原始槽内容，布局与渲染后不同：先隐藏，
     等组件渲染完（data-ready）再显示，避免卡片先以原始布局出现再跳一下。 */
  .plugin-cards-masonry > akm-plugin-card:not([data-ready]) { visibility: hidden; }
  .skeleton {
    animation: skeleton-pulse 1.5s ease-in-out infinite;
    background: rgb(var(--c-skeleton));
    border-radius: 4px;
  }
</style>
